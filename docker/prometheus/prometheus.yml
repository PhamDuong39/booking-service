global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus itself is available even before the Java application is running.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The Java application runs on the host, outside Compose.
  - job_name: booking-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
